name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'

env:
  GODOT_VERSION: "4.5.0"
  PROJECT_PATH: agent-office
  ITCH_USER: pknull
  ITCH_GAME: inference-inc

jobs:
  export:
    name: Export Game
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789 # v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Verify Godot
        run: godot --version

      - name: Build patched godot-xterm
        run: |
          echo "scons==4.10.1 --hash=sha256:bd9d1c52f908d874eba92a8c0c0a8dcf2ed9f3b88ab956d0fce1da479c4e7126" > /tmp/scons-requirements.txt
          python3 -m pip install --user --require-hashes -r /tmp/scons-requirements.txt
          export PATH="$HOME/.local/bin:$PATH"
          cd ${{ env.PROJECT_PATH }}
          ./scripts/build_godot_xterm_linux.sh
          ls -la addons/godot_xterm/lib/

      - name: Import project
        run: |
          set -euo pipefail
          cd ${{ env.PROJECT_PATH }}
          godot --headless --import 2>&1 | tee /tmp/godot-import.log
          if grep -qE '(ERROR|SCRIPT ERROR):' /tmp/godot-import.log; then
            echo "Godot import reported errors" >&2
            exit 1
          fi

      - name: Export Linux
        run: |
          set -euo pipefail
          cd ${{ env.PROJECT_PATH }}
          mkdir -p builds/linux
          godot --headless --export-release "Linux" builds/linux/inference-inc.x86_64 2>&1 | tee /tmp/godot-export.log
          if grep -qE '(ERROR|SCRIPT ERROR):' /tmp/godot-export.log; then
            echo "Godot export reported errors" >&2
            exit 1
          fi
          if grep -qE 'Storing File: res://(Work|tests|builds)/' /tmp/godot-export.log; then
            echo "Private or development-only files entered the release package" >&2
            exit 1
          fi

      - name: Package releases
        run: |
          set -euo pipefail
          cd ${{ env.PROJECT_PATH }}/builds
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
            if [[ ! "$VERSION" =~ ^v[0-9]+(\.[0-9]+){2}([-.][0-9A-Za-z.-]+)?$ ]]; then
              echo "Refusing unsafe release version: $VERSION" >&2
              exit 1
            fi
          else
            VERSION="dev-${GITHUB_SHA:0:12}"
          fi

          XTERM_LIBRARY="libgodot-xterm.linux.template_release.x86_64.so"
          test -x linux/inference-inc.x86_64
          test -f "linux/${XTERM_LIBRARY}"
          cd linux
          zip -9 "../inference-inc-${VERSION}-linux-x86_64.zip" \
            inference-inc.x86_64 \
            "${XTERM_LIBRARY}"
          cd ..
          ls -la *.zip

      - name: Upload Linux artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-build
          path: ${{ env.PROJECT_PATH }}/builds/inference-inc-*-linux-x86_64.zip

  release:
    name: Create Release
    needs: export
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -name "*.zip" -exec mv {} release/ \;
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          files: release/*.zip
          generate_release_notes: true
          body: |
            ## Inference Inc. ${{ github.ref_name }}

            Virtual office simulation that visualizes AI agent activity from Claude Code and Codex CLI sessions.

            ### Downloads

            | Platform | File |
            |----------|------|
            | Linux x86_64 | inference-inc-${{ github.ref_name }}-linux-x86_64.zip |

            ### Requirements
            - Claude Code or Codex CLI for session monitoring
            - Optional local MCP server can be enabled in Settings (port 9999)

            ### Quick Start
            1. Download for your platform
            2. Extract and run the application
            3. Start a Claude Code or Codex CLI session
            4. Watch agents appear in the office!

  publish-itch:
    name: Publish to itch.io
    needs: export
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_ITCH != 'false'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Prepare files
        run: |
          mkdir -p release
          find artifacts -name "*.zip" -exec mv {} release/ \;
          ls -la release/

      - name: Install Butler
        run: |
          set -euo pipefail
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/15.29.0/archive/default
          echo "0568594aadf8bd437b6ca6d5eabc298d414a2ed7275068c5ee82485754db21c2  butler.zip" | sha256sum --check -
          unzip butler.zip
          chmod +x butler
          ./butler -V

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          if [[ ! "$VERSION" =~ ^v[0-9]+(\.[0-9]+){2}([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing unsafe release version: $VERSION" >&2
            exit 1
          fi
          ./butler push "release/inference-inc-${VERSION}-linux-x86_64.zip" "${{ env.ITCH_USER }}/${{ env.ITCH_GAME }}:linux" --userversion "$VERSION"
